<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Оформление заказа на покупку компьютерных комплектующих в TechParts Shop.">
    <title>Оформить заказ — Компьютерные детали</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__logo" href="index.html">TechParts Shop</a>
            <nav class="site-nav" aria-label="Основная навигация">
                <ul class="site-nav__list">
                    <li><a class="site-nav__link" href="index.html">Главная</a></li>
                    <li><a class="site-nav__link" href="catalog.html">Каталог</a></li>
                    <li><a class="site-nav__link" href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a class="breadcrumbs__link" href="index.html">Главная</a>
            <span class="breadcrumbs__current">Оформление заказа</span>
        </nav>
        <section class="section">
            <div class="form-container">
                <h1 style="margin-top: 0; margin-bottom: var(--space-lg); text-align: center;">Оформление покупки</h1>
                
                <form class="order-form" id="main-order-form" action="#" method="post" novalidate>
                    <div class="order-form__field">
                        <label class="order-form__label" for="order-fullname">ФИО получателя</label>
                        <input class="order-form__input" id="order-fullname" name="fullname" type="text" placeholder="Введите ваше полное имя" minlength="3" required>
                    </div>
                    <div class="order-form__field">
                        <label class="order-form__label" for="order-email">Адрес электронной почты (E-mail)</label>
                        <input class="order-form__input" id="order-email" name="email" type="email" placeholder="example@mail.ru" required>
                    </div>
                    <div class="order-form__field">
                        <label class="order-form__label" for="order-phone">Контактный телефон</label>
                        <input class="order-form__input" id="order-phone" name="phone" type="tel" inputmode="tel" placeholder="+7 (900) 000-00-00" pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$" required>
                        <small class="order-form__help">Требуемый формат: +7 (900) 000-00-00</small>
                    </div>
                    <div class="order-form__field">
                        <label class="order-form__label" for="order-category">Категория комплектующих</label>
                        <select class="order-form__select" id="order-category" name="category" required>
                            <option value="">Выберите интересующую категорию</option>
                            <option value="gpu">Видеокарты (NVIDIA / AMD)</option>
                            <option value="cpu">Процессоры (Intel / Ryzen)</option>
                            <option value="ram">Оперативная память (DDR4 / DDR5)</option>
                            <option value="ssd">Твердотельные накопители (M.2 NVMe)</option>
                        </select>
                    </div>
                    <div class="order-form__field">
                        <label class="order-form__label" for="order-comment">Дополнительный комментарий к заказу</label>
                        <textarea class="order-form__textarea" id="order-comment" name="comment" rows="4" placeholder="Укажите модель или ваши пожелания по сборке и тестированию деталей..."></textarea>
                    </div>
                    <div class="order-form__field order-form__field--checkbox">
                        <input id="order-agreement" name="agreement" type="checkbox" required>
                        <label class="order-form__checkbox-label" for="order-agreement">Я согласен на обработку моих персональных данных</label>
                    </div>
                    <div class="order-form__actions">
                        <button class="button button--primary" type="submit" style="width: 100%;">Подтвердить и отправить заказ</button>
                    </div>
                </form>
                <p class="success-message" id="main-success-message" hidden>Форма заказа успешно отправлена! Наш специалист свяжется с вами.</p>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer__inner">
            <p>&copy; 2026 TechParts Shop. Все права защищены.</p>
            <p>Дисциплина: Фронтенд и бэкенд разработка</p>
        </div>
    </footer>
<!-- Кнопка возврата наверх -->
<a class="scroll-top-btn" href="#" aria-label="Вернуться наверх страницы">↑</a>

</body>
</html>
